<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosMatter · 起始页背景风格库</title>
  <style>
    :root { --paper:#f5f8fb; --surface:#fff; --ink:#172b43; --muted:#62788e; --line:#c9dbe7; --blue:#2c78bd; --teal:#278b8b; --violet:#7560ba; --amber:#a87126; }
    [data-theme="dark"] { --paper:#0b1522; --surface:#101e2f; --ink:#e7f0f7; --muted:#9bb0c4; --line:#284057; --blue:#75b8e8; --teal:#72cbbb; --violet:#b6a5ef; --amber:#dfb46a; }
    [data-theme="eye"] { --paper:#eff1e9; --surface:#f8f8f1; --ink:#27372f; --muted:#69766e; --line:#c5d0c2; --blue:#527f84; --teal:#628e75; --violet:#83769a; --amber:#a6814f; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font:14px/1.5 Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; }
    header { display:flex; justify-content:space-between; gap:2rem; align-items:end; padding:clamp(1.3rem,4vw,3.5rem); border-bottom:1px solid var(--line); } .kicker { margin:0; color:var(--teal); font:700 .68rem ui-monospace,monospace; letter-spacing:.12em; } h1 { margin:.45rem 0; font:700 clamp(1.7rem,4vw,3.1rem)/1.1 Georgia,serif; letter-spacing:-.04em; } header p:last-child { max-width:42rem; margin:0; color:var(--muted); }
    .controls { display:flex; gap:.35rem; } button { border:1px solid var(--line); color:var(--muted); background:color-mix(in srgb,var(--surface) 76%,transparent); cursor:pointer; } .controls button { width:2.15rem; height:2.15rem; font-weight:800; } .controls button.active { border-color:var(--blue); color:var(--blue); background:color-mix(in srgb,var(--blue) 9%,transparent); }
    main { max-width:1440px; margin:auto; padding:clamp(1.3rem,4vw,3.2rem); }.selection { display:flex; justify-content:space-between; gap:1rem; align-items:center; margin-bottom:1.25rem; padding:.75rem 0; border-bottom:1px solid var(--line); }.selection strong { color:var(--teal); }.selection span { color:var(--muted); font-size:.8rem; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; }.card { overflow:hidden; padding:0; border:1px solid var(--line); text-align:left; background:var(--surface); transition:transform .2s,border-color .2s; }.card:hover,.card.selected { transform:translateY(-3px); border-color:var(--blue); }.art { position:relative; height:12.5rem; overflow:hidden; isolation:isolate; background:var(--paper); }.art::before,.art::after,.art i,.art b,.art em { position:absolute; display:block; content:""; pointer-events:none; }.info { display:grid; grid-template-columns:2.2rem 1fr; gap:.15rem .55rem; padding:.8rem .9rem .95rem; }.info b { grid-row:span 2; color:var(--blue); font:.68rem ui-monospace,monospace; }.info strong { font:700 1rem Georgia,serif; }.info small { color:var(--muted); font-size:.7rem; }
    /* 01 side vessel */ .vessel::before { inset:34% 7% 25% 6%; border:1px solid var(--blue); border-radius:58% 10% 17% 45%; background:linear-gradient(110deg,color-mix(in srgb,var(--blue) 13%,transparent),transparent 57%); clip-path:polygon(0 55%,20% 24%,60% 8%,100% 43%,80% 67%,48% 83%,15% 78%); }.vessel::after { right:9%; bottom:17%; width:52%; height:29%; border-top:1px solid var(--violet); border-radius:50%; }.vessel i { top:44%; left:26%; width:48%; border-top:1px solid var(--teal); transform:rotate(-8deg); }.vessel b { top:35%; left:53%; width:.42rem; height:.42rem; border-radius:50%; background:var(--teal); box-shadow:1.25rem .45rem 0 var(--teal),2.4rem .1rem 0 color-mix(in srgb,var(--teal) 55%,transparent); }
    /* 02 radar */ .radar { background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--teal) 7%,transparent),transparent 36%); }.radar::before { inset:8% 29%; border:1px solid var(--teal); border-radius:50%; box-shadow:0 0 0 2.7rem transparent,0 0 0 5.5rem color-mix(in srgb,var(--teal) 14%,transparent),0 0 0 8.4rem transparent; }.radar::after { top:50%; left:50%; width:43%; border-top:1px solid var(--blue); transform-origin:left; transform:rotate(-39deg); }.radar i { top:47%; left:68%; width:.5rem; height:.5rem; border-radius:50%; background:var(--amber); box-shadow:-4.3rem 2.1rem 0 var(--violet); }
    /* 03 horizon */ .horizon::before { right:-4%; bottom:-31%; width:86%; height:100%; border:1px solid var(--blue); border-radius:50% 50% 0 0; }.horizon::after { left:8%; right:7%; bottom:31%; border-top:1px solid var(--teal); }.horizon i { right:18%; bottom:50%; width:26%; height:34%; border-left:1px dashed var(--violet); border-top:1px dashed var(--violet); transform:skewX(-28deg); }.horizon b { right:20%; bottom:60%; width:.45rem; height:.45rem; border-radius:50%; background:var(--amber); }
    /* 04 drydock */ .dock::before { inset:19% 29%; border:1px solid var(--violet); border-radius:50%; box-shadow:0 0 0 .7rem var(--paper),0 0 0 .82rem color-mix(in srgb,var(--violet) 50%,transparent),0 0 0 3.3rem transparent,0 0 0 3.42rem color-mix(in srgb,var(--teal) 45%,transparent); }.dock::after { top:50%; left:18%; right:18%; border-top:1px solid var(--teal); }.dock i { top:19%; bottom:19%; left:50%; border-left:1px solid var(--blue); }.dock b { top:48%; left:46%; width:8%; height:4%; border:1px solid var(--amber); transform:skewX(-22deg); }
    /* 05 reading beam */ .beam::before { top:-38%; right:-7%; width:72%; height:120%; border:1px solid var(--amber); border-radius:50%; }.beam::after { left:18%; right:6%; bottom:12%; height:52%; background:linear-gradient(105deg,transparent 5%,color-mix(in srgb,var(--amber) 14%,transparent) 50%,transparent 51%); clip-path:polygon(0 100%,32% 0,44% 0,100% 100%); }.beam i { top:24%; left:31%; height:51%; border-left:1px solid var(--teal); }.beam b { top:32%; left:29%; width:.46rem; height:.46rem; border-radius:50%; background:var(--blue); }
    /* 06 crystal lattice */ .lattice { background:linear-gradient(30deg,transparent 49%,color-mix(in srgb,var(--blue) 15%,transparent) 50%,transparent 51%),linear-gradient(-30deg,transparent 49%,color-mix(in srgb,var(--teal) 15%,transparent) 50%,transparent 51%); background-size:3.3rem 5.7rem; }.lattice::before { inset:17% 13%; border:1px solid color-mix(in srgb,var(--violet) 68%,transparent); clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }.lattice::after { inset:31% 34%; border:1px solid var(--amber); clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }.lattice i { top:49%; left:49%; width:.5rem; height:.5rem; border-radius:50%; background:var(--teal); }
    /* 07 coordinate field */ .coords::before { inset:12% 10%; background:repeating-linear-gradient(0deg,transparent 0 2.5rem,color-mix(in srgb,var(--line) 65%,transparent) 2.5rem 2.56rem),repeating-linear-gradient(90deg,transparent 0 2.5rem,color-mix(in srgb,var(--line) 65%,transparent) 2.5rem 2.56rem); }.coords::after { top:15%; bottom:15%; left:52%; border-left:1px solid var(--teal); }.coords i { top:39%; left:27%; width:46%; border-top:1px solid var(--blue); transform:rotate(-24deg); }.coords b { top:31%; left:59%; width:.48rem; height:.48rem; border-radius:50%; background:var(--amber); box-shadow:-4.1rem 2.2rem 0 var(--violet); }
    /* 08 fleet wake */ .wake::before { left:9%; top:52%; width:78%; border-top:1px dashed var(--teal); transform:rotate(-13deg); }.wake::after { left:18%; top:62%; width:66%; border-top:1px dashed color-mix(in srgb,var(--blue) 60%,transparent); transform:rotate(-13deg); }.wake i { top:34%; left:49%; width:0; height:0; border-top:.7rem solid transparent; border-bottom:.7rem solid transparent; border-left:1.55rem solid var(--blue); }.wake b { top:47%; left:32%; width:0; height:0; border-top:.42rem solid transparent; border-bottom:.42rem solid transparent; border-left:.9rem solid var(--violet); box-shadow:4.7rem -1.5rem 0 -0.1rem var(--amber); }
    /* 09 archive corridor */ .archive::before { inset:16% 11%; border:1px solid var(--blue); clip-path:polygon(0 0,100% 0,74% 100%,26% 100%); }.archive::after { left:50%; top:16%; bottom:16%; border-left:1px solid var(--teal); }.archive i { top:27%; bottom:25%; left:27%; right:27%; border-top:1px solid color-mix(in srgb,var(--violet) 60%,transparent); border-bottom:1px solid color-mix(in srgb,var(--violet) 60%,transparent); }.archive b { left:49%; top:42%; width:.5rem; height:.5rem; border-radius:50%; background:var(--amber); }
    /* 10 phase contours */ .contour::before { inset:-38% 8% 11%; border:1px solid var(--blue); border-radius:50%; box-shadow:0 0 0 2.3rem transparent,0 0 0 2.42rem color-mix(in srgb,var(--teal) 44%,transparent),0 0 0 5rem transparent,0 0 0 5.12rem color-mix(in srgb,var(--violet) 38%,transparent); }.contour::after { left:14%; right:14%; bottom:28%; border-top:1px solid var(--amber); }.contour i { left:61%; bottom:26%; width:.5rem; height:.5rem; border-radius:50%; background:var(--amber); }
    /* 11 citation constellation */ .constellation::before { inset:10%; background:radial-gradient(circle at 16% 66%,var(--blue) 0 .25rem,transparent .28rem),radial-gradient(circle at 36% 34%,var(--teal) 0 .34rem,transparent .37rem),radial-gradient(circle at 55% 58%,var(--violet) 0 .28rem,transparent .31rem),radial-gradient(circle at 79% 25%,var(--amber) 0 .4rem,transparent .43rem),radial-gradient(circle at 87% 73%,var(--teal) 0 .24rem,transparent .27rem); }.constellation::after { left:18%; top:64%; width:63%; border-top:1px solid color-mix(in srgb,var(--blue) 65%,transparent); transform:rotate(-29deg); transform-origin:left; }.constellation i { left:38%; top:35%; width:46%; border-top:1px solid color-mix(in srgb,var(--violet) 60%,transparent); transform:rotate(25deg); transform-origin:left; }
    /* 12 binary outpost */ .binary::before { top:20%; left:19%; width:32%; aspect-ratio:1; border:1px solid var(--amber); border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--amber) 15%,transparent),transparent 70%); }.binary::after { right:14%; bottom:16%; width:38%; aspect-ratio:1; border:1px solid var(--blue); border-radius:50%; }.binary i { top:45%; left:39%; width:30%; border-top:1px solid var(--teal); transform:rotate(-26deg); }.binary b { top:47%; left:48%; width:.5rem; height:.5rem; border-radius:50%; background:var(--violet); }
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}} @media(max-width:560px){header{align-items:start;flex-direction:column;}.grid{grid-template-columns:1fr;}.selection{align-items:start;flex-direction:column;}}
  </style>
</head>
<body data-theme="eye">
  <header><div><p class="kicker">COSMATTER / LAUNCH BACKGROUND STUDIES</p><h1>起始页背景风格库</h1><p>点击任一方案即可选中。所有方案均为原创 CSS 几何，可适配浅色、深色与护眼主题；不使用外部图片或 IP。</p></div><div class="controls" aria-label="Theme"><button data-theme-button="light" title="浅色">☀</button><button data-theme-button="dark" title="深色">☾</button><button data-theme-button="eye" class="active" title="护眼">◉</button></div></header>
  <main><div class="selection"><strong id="selected">当前选择：尚未选择</strong><span>推荐优先比较 01、04、08、09：它们最接近“科研舰队”，且不会干扰输入区。</span></div><section class="grid" id="gallery"></section></main>
  <script>
    const items=[['vessel','侧视考察舰','Side survey vessel'],['radar','观测雷达','Observation radar'],['horizon','远距地平线','Distant horizon'],['dock','环形船坞','Orbital drydock'],['beam','档案光束','Archive beam'],['lattice','材料晶格','Materials lattice'],['coords','坐标场','Coordinate field'],['wake','编队航迹','Fleet wake'],['archive','档案航廊','Archive corridor'],['contour','相图等值线','Phase contours'],['constellation','引文星座','Citation constellation'],['binary','双星前哨','Binary outpost']];
    const gallery=document.querySelector('#gallery'), selected=document.querySelector('#selected');
    gallery.innerHTML=items.map(([kind,zh,en],i)=>`<button class="card" data-name="${String(i+1).padStart(2,'0')} · ${zh} / ${en}"><div class="art ${kind}"><i></i><b></b><em></em></div><div class="info"><b>${String(i+1).padStart(2,'0')}</b><strong>${zh}</strong><small>${en}</small></div></button>`).join('');
    gallery.addEventListener('click',event=>{const card=event.target.closest('.card'); if(!card)return; document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected')); card.classList.add('selected'); selected.textContent=`当前选择：${card.dataset.name}`;});
    document.querySelectorAll('[data-theme-button]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.theme=button.dataset.themeButton; document.querySelectorAll('[data-theme-button]').forEach(x=>x.classList.remove('active')); button.classList.add('active');}));
  </script>
</body>
</html>
