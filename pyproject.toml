[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmatter"
version = "0.1.0"
description = "Evidence-first materials-literature navigation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sciverse==0.7.1", "certifi>=2024.8.30"]

[project.optional-dependencies]
scibase = ["pyarrow"]

[project.scripts]
cosmatter = "cosmatter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
