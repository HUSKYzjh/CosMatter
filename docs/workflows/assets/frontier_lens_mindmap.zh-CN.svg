<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Lens workflow mind map</title><desc id="desc">Research question to seed papers, Paper Schema, guide, graph, paper details, and provenance text.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071622"/><stop offset="1" stop-color="#123148"/></linearGradient><style>.h{font:700 34px Arial,sans-serif;fill:#eefaff;letter-spacing:1px}.s{font:500 16px Arial,sans-serif;fill:#a8c6d6}.k{font:700 13px Arial,sans-serif;fill:#69d5e4;letter-spacing:1px}.n{font:700 22px Arial,sans-serif;fill:#f3fbff}.p{font:400 15px Arial,sans-serif;fill:#bed5df}.l{fill:none;stroke:#579cb4;stroke-width:2.5;stroke-linecap:round}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="100" cy="120" r="3" fill="#7fe4ef"/><circle cx="1490" cy="850" r="3" fill="#80b9ff"/>
  <text x="75" y="72" class="h">FRONTIER LENS / RESEARCH READING WORKFLOW</text><text x="75" y="104" class="s">Question-driven topic maps, guided reading, and provenance backtracking</text>
  <path d="M430 505 H545 M805 505 H920 M1180 505 H1295" class="l"/><path d="M675 610 C675 720 590 750 475 750" class="l"/><path d="M1050 610 C1050 720 1130 750 1240 750" class="l"/>
  <g><rect x="80" y="410" width="350" height="190" rx="24" fill="#0d2c40" stroke="#56cddd"/><text x="115" y="455" class="k">01 / DEFINE THE SCOPE</text><text x="115" y="496" class="n">Research Question</text><text x="115" y="530" class="p">object, task, comparison</text><text x="115" y="556" class="p">concise search terms</text></g>
  <g><rect x="545" y="390" width="260" height="230" rx="24" fill="#12374a" stroke="#62b6de"/><text x="577" y="435" class="k">02 / DISCOVER</text><text x="577" y="476" class="n">Seed Papers</text><text x="577" y="510" class="p">bounded Paper Schema corpus</text><text x="577" y="536" class="p">starting points, not verdicts</text><text x="577" y="577" class="k">TOPIC MAP STARTS HERE</text></g>
  <g><rect x="920" y="390" width="260" height="230" rx="24" fill="#19374b" stroke="#7f9ee5"/><text x="952" y="435" class="k">03 / STRUCTURE</text><text x="952" y="476" class="n">Paper Schema</text><text x="952" y="510" class="p">Entity / Relation / Citation</text><text x="952" y="536" class="p">Evidence as graph material</text><text x="952" y="577" class="k">IN-PAPER vs CROSS-PAPER</text></g>
  <g><rect x="1295" y="410" width="225" height="190" rx="24" fill="#173b3d" stroke="#6acbaa"/><text x="1325" y="455" class="k">04 / NAVIGATE</text><text x="1325" y="496" class="n">Guide + Graph</text><text x="1325" y="530" class="p">Roadmap</text><text x="1325" y="556" class="p">Knowledge Subgraph</text></g>
  <g><rect x="250" y="690" width="450" height="180" rx="24" fill="#203945" stroke="#92bb75"/><text x="285" y="735" class="k">05 / READ IN CONTEXT</text><text x="285" y="776" class="n">Paper Cards + Knowledge Structure</text><text x="285" y="810" class="p">contributions, methods, experiments, metrics</text><text x="285" y="836" class="p">choose the next paper to open</text></g>
  <g><rect x="930" y="690" width="440" height="180" rx="24" fill="#15394b" stroke="#61d6e5"/><text x="965" y="735" class="k">06 / VERIFY</text><text x="965" y="776" class="n">Entity / Evidence to Original Text</text><text x="965" y="810" class="p">jump to and highlight provenance paragraphs</text><text x="965" y="836" class="p">a graph guides reading; original papers support claims</text></g>
  <text x="800" y="946" class="s" text-anchor="middle">A practical first loop: narrow question - 3 to 5 seed papers - graph - paper detail - original text.</text>
</svg>