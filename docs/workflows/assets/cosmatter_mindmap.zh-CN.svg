<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">CosMatter evidence-chain mind map</title><desc id="desc">A materials literature workflow from mission boundary to human-approved evidence, condition diagnostics, research gap candidates, and audited report.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b161b"/><stop offset="1" stop-color="#203022"/></linearGradient><style>.h{font:700 34px Arial,sans-serif;fill:#f1fbf6;letter-spacing:1px}.s{font:500 16px Arial,sans-serif;fill:#b6c7bd}.k{font:700 13px Arial,sans-serif;fill:#81dbb6;letter-spacing:1px}.n{font:700 21px Arial,sans-serif;fill:#f4fcf7}.p{font:400 14px Arial,sans-serif;fill:#c5d4ca}.g{font:700 13px Arial,sans-serif;fill:#ffe2a6}.l{fill:none;stroke:#61b991;stroke-width:2.6;stroke-linecap:round}.w{fill:none;stroke:#dfa95f;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 7}</style></defs>
  <rect width="1800" height="1080" fill="url(#bg)"/><circle cx="82" cy="100" r="3" fill="#83e7bd"/><circle cx="1720" cy="980" r="3" fill="#e4b364"/>
  <text x="70" y="70" class="h">COSMATTER / MATERIALS LITERATURE EVIDENCE CHAIN</text><text x="70" y="102" class="s">Model outputs are drafts. Human gates, conditions, and source traceability decide what reaches a report.</text>
  <path d="M225 455 H340 M585 455 H700 M945 455 H1060 M1305 455 H1420" class="l"/><path d="M822 585 C822 690 690 730 580 730" class="l"/><path d="M1182 585 C1182 690 1285 730 1390 730" class="l"/><path d="M1515 585 C1515 705 1595 740 1660 740" class="l"/><path d="M1530 858 C1510 940 1375 950 1270 950" class="w"/>
  <g><rect x="45" y="360" width="180" height="190" rx="22" fill="#18383a" stroke="#62cdb5"/><text x="73" y="402" class="k">01 / BOUNDARY</text><text x="73" y="440" class="n">Mission Brief</text><text x="73" y="476" class="p">question</text><text x="73" y="499" class="p">material / property / scope</text></g>
  <g><rect x="340" y="360" width="245" height="190" rx="22" fill="#1d3b3b" stroke="#74c3a7"/><text x="370" y="402" class="k">02 / HUMAN APPROVAL</text><text x="370" y="440" class="n">FlightPlan</text><text x="370" y="476" class="p">subquestions / main + counter queries</text><text x="370" y="505" class="g">GATE: no approval, no execution</text></g>
  <g><rect x="700" y="360" width="245" height="190" rx="22" fill="#223d38" stroke="#94bf82"/><text x="730" y="402" class="k">03 / RETRIEVE</text><text x="730" y="440" class="n">Paper Candidates</text><text x="730" y="476" class="p">Sciverse / local authorized corpus</text><text x="730" y="500" class="p">exact DOI / ID deduplication</text><text x="730" y="526" class="g">CANDIDATE IS NOT EVIDENCE</text></g>
  <g><rect x="1060" y="360" width="245" height="190" rx="22" fill="#2b3e35" stroke="#b1c476"/><text x="1090" y="402" class="k">04 / HUMAN SCREENING</text><text x="1090" y="440" class="n">Full-text Admission</text><text x="1090" y="476" class="p">include / exclude every candidate</text><text x="1090" y="505" class="g">GATE: screened before parsing</text></g>
  <g><rect x="1420" y="360" width="320" height="190" rx="22" fill="#3b3d31" stroke="#dfb466"/><text x="1450" y="402" class="k">05 / AUTHORISED FULL TEXT</text><text x="1450" y="440" class="n">MinerU + Source Map</text><text x="1450" y="476" class="p">bounded quotes / locator / hash</text><text x="1450" y="501" class="p">no restricted full text in run artifacts</text></g>
  <g><rect x="325" y="665" width="510" height="190" rx="22" fill="#223d3a" stroke="#71c9a1"/><text x="358" y="707" class="k">06 / FACTS + EVIDENCE</text><text x="358" y="745" class="n">LLM Draft - Human-approved Material Fact / EvidenceCard</text><text x="358" y="781" class="p">composition / structure / property / process / conditions / simulation</text><text x="358" y="809" class="g">GATE: quote and locator exactly match the Source Map</text></g>
  <g><rect x="1060" y="665" width="330" height="190" rx="22" fill="#313f35" stroke="#b7c777"/><text x="1093" y="707" class="k">07 / CROSS-PAPER DIAGNOSIS</text><text x="1093" y="745" class="n">Conditions, Fusion, Graph</text><text x="1093" y="781" class="p">units / condition matrix / counterevidence</text><text x="1093" y="809" class="p">different conditions are not directly comparable</text></g>
  <g><rect x="1495" y="665" width="260" height="190" rx="22" fill="#413a2e" stroke="#e1b264"/><text x="1528" y="707" class="k">08 / RESEARCH OPPORTUNITY</text><text x="1528" y="745" class="n">Research Gap</text><text x="1528" y="781" class="p">conflict / missing connection</text><text x="1528" y="805" class="p">falsifiable hypothesis</text><text x="1528" y="832" class="g">GATE: expert review required</text></g>
  <g><rect x="1030" y="915" width="330" height="120" rx="22" fill="#203944" stroke="#73ccdb"/><text x="1063" y="956" class="k">09 / DELIVER + AUDIT</text><text x="1063" y="993" class="n">Report / UI / Readiness</text><text x="1063" y="1020" class="p">export only de-identified, gated artifacts</text></g>
  <text x="900" y="1068" class="s" text-anchor="middle">Every visible fact should trace back to mission boundary, screening decision, source location, conditions, and human review.</text>
</svg>